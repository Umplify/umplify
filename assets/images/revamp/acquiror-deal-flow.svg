<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">Acquiror AI deal flow</title><desc id="d">Six steps from a signed LOI to an investor-ready memo: upload, normalize, value, underwrite, durability, memo, all on one deal record with one audit trail.</desc><rect width="1200" height="700" rx="28" fill="#EEF6FF"/><text x="600" y="92" text-anchor="middle" fill="#0E4D8C" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">Acquiror AI</text><text x="600" y="134" text-anchor="middle" fill="#4F6F94" font-family="Arial, Helvetica, sans-serif" font-size="22">From signed LOI to investor-ready memo</text><path d="M398 265H442" stroke="#4F9CE0" stroke-width="8" stroke-linecap="round"/><path d="M758 265H802" stroke="#4F9CE0" stroke-width="8" stroke-linecap="round"/><path d="M960 340V362C960 372 952 380 942 380H258C248 380 240 388 240 398V412" stroke="#4F9CE0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M398 495H442" stroke="#4F9CE0" stroke-width="8" stroke-linecap="round"/><path d="M758 495H802" stroke="#4F9CE0" stroke-width="8" stroke-linecap="round"/><g font-family="Arial, Helvetica, sans-serif"><rect x="90" y="190" width="300" height="150" rx="22" fill="#FFFFFF" stroke="#B9D8F6" stroke-width="3"/><circle cx="130" cy="235" r="22" fill="#0E4D8C"/><text x="130" y="243" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">1</text><text x="165" y="244" fill="#0E4D8C" font-size="26" font-weight="700">Upload</text><text x="120" y="290" fill="#4F6F94" font-size="17">CIM and statements,</text><text x="120" y="316" fill="#4F6F94" font-size="17">figures extracted by Vera</text><rect x="450" y="190" width="300" height="150" rx="22" fill="#FFFFFF" stroke="#B9D8F6" stroke-width="3"/><circle cx="490" cy="235" r="22" fill="#0E4D8C"/><text x="490" y="243" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">2</text><text x="525" y="244" fill="#0E4D8C" font-size="26" font-weight="700">Normalize</text><text x="480" y="290" fill="#4F6F94" font-size="17">QoE workbench, add-backs,</text><text x="480" y="316" fill="#4F6F94" font-size="17">locked EBITDA</text><rect x="810" y="190" width="300" height="150" rx="22" fill="#FFFFFF" stroke="#B9D8F6" stroke-width="3"/><circle cx="850" cy="235" r="22" fill="#0E4D8C"/><text x="850" y="243" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">3</text><text x="885" y="244" fill="#0E4D8C" font-size="26" font-weight="700">Value</text><text x="840" y="290" fill="#4F6F94" font-size="17">Comparables, DCF, and</text><text x="840" y="316" fill="#4F6F94" font-size="17">adjusted net assets</text><rect x="90" y="420" width="300" height="150" rx="22" fill="#FFFFFF" stroke="#B9D8F6" stroke-width="3"/><circle cx="130" cy="465" r="22" fill="#0E4D8C"/><text x="130" y="473" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">4</text><text x="165" y="474" fill="#0E4D8C" font-size="26" font-weight="700">Underwrite</text><text x="120" y="520" fill="#4F6F94" font-size="17">DSCR, stress tests,</text><text x="120" y="546" fill="#4F6F94" font-size="17">debt capacity</text><rect x="450" y="420" width="300" height="150" rx="22" fill="#FFFFFF" stroke="#B9D8F6" stroke-width="3"/><circle cx="490" cy="465" r="22" fill="#0E4D8C"/><text x="490" y="473" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">5</text><text x="525" y="474" fill="#0E4D8C" font-size="26" font-weight="700">Durability</text><text x="480" y="520" fill="#4F6F94" font-size="17">Concentration, retention,</text><text x="480" y="546" fill="#4F6F94" font-size="17">working capital</text><rect x="810" y="420" width="300" height="150" rx="22" fill="#0E4D8C" stroke="#9FD4FF" stroke-width="3"/><circle cx="850" cy="465" r="22" fill="#FFFFFF"/><text x="850" y="473" text-anchor="middle" fill="#0E4D8C" font-size="22" font-weight="700">6</text><text x="885" y="474" fill="#FFFFFF" font-size="26" font-weight="700">Memo</text><text x="840" y="520" fill="#D6ECFF" font-size="17">Approved figures with</text><text x="840" y="546" fill="#D6ECFF" font-size="17">an evidence appendix</text><rect x="90" y="606" width="1020" height="56" rx="18" fill="#FFFFFF" stroke="#B9D8F6" stroke-width="3"/><text x="600" y="641" text-anchor="middle" fill="#0E4D8C" font-size="20" font-weight="700">One deal record  •  One audit trail  •  Data at rest in Canada</text></g></svg>
